<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #5e5656;
      font-family: Arial, sans-serif;
      color: white;
    }

    .login-box {
      background-color: #383838;
      padding: 40px;
      border-radius: 10px;
      text-align: center;
      width: 300px;
    }

    input {
      width: 90%;
      padding: 10px;
      margin: 10px 0;
      border: none;
      border-radius: 5px;
    }

    button {
      padding: 10px;
      width: 100%;
      border: none;
      border-radius: 5px;
      background-color: #222;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background-color: #111;
    }
  </style>
</head>

<body>

  <div class="login-box">
    <h2>Login</h2>

    <input type="text" placeholder="Username">
    <input type="password" placeholder="Password">

    <button onclick="login()">Σύνδεση</button>
  </div>

  <script>
    function login() {
      alert("Test");
    }
  </script>

</body>
</html>
